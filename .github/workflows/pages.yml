name: Deploy werc site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    env:
      WERC_PLAN9: ${{ github.workspace }}/.cache/plan9port
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install C compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential

      - name: Restore pinned Plan 9 tools
        id: plan9-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.WERC_PLAN9 }}
          key: plan9port-ubuntu24-${{ runner.arch }}-b6564bd96ca189c69e28797738dad56f91eb5967-${{ hashFiles('scripts/setup_werc.py') }}

      - name: Prepare real werc runtime
        run: python3 scripts/setup_werc.py

      - name: Save successfully built Plan 9 tools
        if: steps.plan9-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.WERC_PLAN9 }}
          key: ${{ steps.plan9-cache.outputs.cache-primary-key }}

      - name: Check live werc rendering
        id: werc-check
        run: python3 scripts/check_werc.py

      - name: Diagnose failed werc rendering
        if: failure() && steps.werc-check.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          import sys

          sys.path.insert(0, 'scripts')
          import werc_runtime

          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.openings, self.closings = Counter(), Counter()
              def handle_starttag(self, tag, attributes):
                  self.openings[tag] += 1
              def handle_endtag(self, tag):
                  self.closings[tag] += 1

          completed = []
          original_run = werc_runtime.subprocess.run
          def capture_run(*args, **kwargs):
              result = original_run(*args, **kwargs)
              completed.append(result)
              return result
          werc_runtime.subprocess.run = capture_run

          try:
              werc_runtime.prepare()
              response = werc_runtime.render('/')
              text = response.body.decode(errors='replace')
              parser = Tags()
              parser.feed(text)
              parser.close()
              print('Root response status:', response.status)
              print('Opening tags:', dict(parser.openings))
              print('Closing tags:', dict(parser.closings))
              lines = text.splitlines()
              print('First 16 HTML lines (up to 300 characters each):')
              for line in lines[:16]:
                  print(line[:300])
              print('Last 8 HTML lines (up to 300 characters each):')
              for line in lines[-8:]:
                  print(line[:300])
          except Exception as error:
              print('Root render diagnostic:', type(error).__name__, str(error))
              stderr = getattr(error, 'stderr', None)
              if stderr:
                  print('Exception stderr:', stderr.decode(errors='replace')[-6000:])
          finally:
              for result in completed:
                  print('rc exit code:', result.returncode)
                  print('rc stderr (last 6000 characters):')
                  print(result.stderr.decode(errors='replace')[-6000:] or '(empty)')
          PY

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Export werc pages for the deployment path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/export_werc.py --base-path "$PAGES_BASE_PATH"

      - name: Check exported links, assets, and redirects
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/check_export.py --base-path "$PAGES_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
